<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; }

        #widget-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 999999;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #widget-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        #widget-portal {
            position: fixed;
            inset: 0;
            z-index: 999998;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #widget-portal.open {
            display: flex;
        }

        #widget-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        #widget-frame {
            position: relative;
            z-index: 1;
            width: 680px;
            height: 780px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
            opacity: 0;
            transform: scale(0.95) translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        #widget-portal.open #widget-frame {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        @media (max-width: 520px) {
            #widget-frame {
                width: 100%;
                height: 100%;
                border-radius: 0;
                transform: translateY(20px);
            }

            #widget-portal.open #widget-frame {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

<button id="widget-btn" onclick="toggleWidget()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
</button>

<div id="widget-portal">
    <div id="widget-backdrop" onclick="toggleWidget()"></div>
    <iframe
            id="widget-frame"
            src="http://localhost:3001/ru/widget-chat?theme=light&institutionId=019ccd2b-f1b7-77d0-8ef6-5abfc8bd8a50&lang=ru"
    ></iframe>
</div>

<script>
    const portal = document.getElementById('widget-portal');
    const frame = document.getElementById('widget-frame');
    let isOpen = false;

    function openWidget() {
        isOpen = true;
        portal.classList.add('open');
        document.body.style.overflow = 'hidden';
        frame.contentWindow?.postMessage({ type: 'WIDGET_OPEN' }, '*');
    }

    function closeWidget() {
        isOpen = false;
        portal.classList.remove('open');
        document.body.style.overflow = '';
    }

    function toggleWidget() {
        if (isOpen) {
            closeWidget();
        } else {
            openWidget();
        }
    }

    window.addEventListener('message', (e) => {
        if (e.data?.type === 'WIDGET_CLOSE') closeWidget();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isOpen) closeWidget();
    });
</script>
</body>
</html>
